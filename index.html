<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox Triage Workflow - live demo</title>
  <meta name="description" content="End-to-end email triage workflow running in your browser." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
  <style>
    #loading { font-family: system-ui, sans-serif; max-width: 560px; margin: 18vh auto; padding: 0 16px;
               color: #334155; text-align: center; line-height: 1.5; }
    #loading .bar { height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin: 20px 0; }
    #loading .bar i { display: block; height: 100%; width: 40%; background: #6366f1; animation: slide 1.4s infinite; }
    @keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }
  </style>
</head>
<body>
  <div id="loading">
    <h2>Inbox Triage Workflow</h2>
    <div class="bar"><i></i></div>
    <p>Loading Python in your browser. The first visit takes about 20-40 seconds;
       after that it is cached.</p>
    <p style="font-size: 0.9em; color: #64748b">Nothing is sent to a server: the whole workflow runs on your device.
       Source code: <a href="https://github.com/MrunalKulkarni082/inbox-triage">GitHub</a></p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    const files = ["app.py", "data/sample_inbox/01_internship_complete.eml", "data/sample_inbox/02_internship_gmail_sparse.eml", "data/sample_inbox/03_internship_past_grad.eml", "data/sample_inbox/04_internship_html_only.eml", "data/sample_inbox/05_internship_duplicate_resend.eml", "data/sample_inbox/06_internship_followup.eml", "data/sample_inbox/07_internship_bad_phone.eml", "data/sample_inbox/08_internship_two_addresses.eml", "data/sample_inbox/09_sales_clinic.eml", "data/sample_inbox/10_sales_logistics_freemail.eml", "data/sample_inbox/11_sales_retail_demo.eml", "data/sample_inbox/12_sales_missing_org.eml", "data/sample_inbox/13_support_with_order.eml", "data/sample_inbox/14_support_no_order.eml", "data/sample_inbox/15_support_ticket.eml", "data/sample_inbox/16_vendor_seo.eml", "data/sample_inbox/17_vendor_outsourcing.eml", "data/sample_inbox/18_spam_lottery.eml", "data/sample_inbox/19_spam_crypto.eml", "data/sample_inbox/20_spam_phishing.eml", "data/sample_inbox/21_unknown_vague.eml", "data/sample_inbox/22_empty_body.eml", "data/sample_inbox/23_ambiguous_student_quote.eml", "data/sample_inbox/24_support_forwarded_thread.eml", "data/sample_inbox/25_sales_detailed.eml", "data/sample_inbox/26_internship_mixed_language.eml", "data/sample_inbox/27_vendor_partnership.eml", "data/sample_inbox/28_sales_subject_only.eml", "data/sample_inbox/29_support_refund.eml", "data/sample_inbox/30_internship_class_of.eml", "data/sample_labels.csv", "templates/internship.j2", "templates/sales_lead.j2", "templates/support.j2", "templates/unknown.j2", "templates/vendor.j2", "triage/__init__.py", "triage/ai_classifier.py", "triage/classifier.py", "triage/drafter.py", "triage/extractor.py", "triage/models.py", "triage/parser.py", "triage/pipeline.py", "triage/storage.py", "triage/validator.py"];
    const spec = {};
    for (const f of files) spec[f] = { url: "./" + f };
    mount({ requirements: ["pydantic", "jinja2", "sqlite3"], entrypoint: "app.py", files: spec },
          document.getElementById("root"));
    const hide = new MutationObserver(() => {
      if (document.querySelector("#root [data-testid]")) {
        document.getElementById("loading").remove(); hide.disconnect();
      }
    });
    hide.observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
